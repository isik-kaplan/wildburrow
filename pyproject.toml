[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "wildburrow"
version = "0.3.0"
description = "Self-hosted HTTP tunnels with on-demand wildcard certificates at any depth"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Işık Kaplan" }]
keywords = ["tunnel", "ngrok", "reverse-proxy", "ssh", "websocket", "acme", "letsencrypt", "wildcard"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Internet :: Proxy Servers",
    "Topic :: System :: Networking",
]
requires-python = ">=3.14.4"
dependencies = [
    "click==8.5.0",
    "questionary==2.1.1",
    "websockets==17.2",
]

[project.urls]
Repository = "https://github.com/isik-kaplan/wildburrow"
Issues = "https://github.com/isik-kaplan/wildburrow/issues"
Changelog = "https://github.com/isik-kaplan/wildburrow/blob/master/CHANGELOG.md"

[project.optional-dependencies]
server = [
    "acme==5.8.0",
    "argon2-cffi==25.1.0",
    "asyncssh==2.24.1",
    "cryptography==50.0.2",
    "httpx==0.28.1",
    "josepy==2.2.0",
]

[project.scripts]
wildburrow = "wildburrow.cli:main"

[project.entry-points."wildburrow.transports"]
ssh = "wildburrow.transports.ssh:SSHTransport"
websocket = "wildburrow.transports.websocket:WebSocketTransport"

[project.entry-points."wildburrow.auth"]
key = "wildburrow.auth.keys:KeyAuth"
password = "wildburrow.auth.password:PasswordAuth"
token = "wildburrow.auth.token:TokenAuth"

[project.entry-points."wildburrow.dns"]
cloudflare = "wildburrow.dns.cloudflare:CloudflareDNS"

[dependency-groups]
dev = [
    "hypothesis==6.169.0",
    "mutmut==3.8.0",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-cov==7.1.0",
    "pytest-timeout==2.4.0",
    "pytest-xdist==3.8.0",
    "ruff==0.17.0",
]

[tool.hatch.build.targets.sdist]
include = ["/wildburrow", "/tests", "/docs", "/README.md", "/CHANGELOG.md", "/LICENSE"]

[tool.hatch.build.targets.wheel]
packages = ["wildburrow"]

[tool.uv]
default-groups = ["dev"]

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "ASYNC", "RUF", "SIM", "PT"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S603", "S607", "ASYNC110"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "--strict-markers --cov --cov-branch --cov-report=term-missing -m 'not system'"
markers = [
    "e2e: drives real clients against a running server",
    "acme: needs Docker for a local Pebble ACME server",
    "system: installs the real service, so it needs root through sudo without a password",
]
filterwarnings = ["error"]
timeout = 120
# Ends the run outright: raised inside the code instead, a timeout can be caught and the hang carries on.
timeout_method = "thread"

[tool.coverage.run]
source = ["wildburrow", "scripts"]
branch = true

[tool.coverage.report]
fail_under = 100
show_missing = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", "\\.\\.\\.$"]

[tool.mutmut]
source_paths = ["wildburrow"]
also_copy = ["scripts"]
# The trampolines add statements no coverage gate can account for, and a fixed seed keeps a verdict repeatable.
# The slowest test takes seconds, so a test still going at 30 is a mutant hanging it, not a slow test.
pytest_add_cli_args = ["--no-cov", "--hypothesis-seed=0", "--timeout=30", "-p", "scripts.mutation_killers"]
# mutmut stops a run at (estimated + constant) * 15 seconds; this keeps that past the 30 a hung test gets, so the test
# timeout fails it the way it would fail a run without mutmut.
timeout_constant = 3
# Starting a flag at False or an optional at None leaves one mutant, the other falsy value, which nothing can tell apart.
do_not_mutate_patterns = ['^\s*[\w.]+(: [^=]+)? = (False|None)$']
