name: CI

on:
  pull_request:
  # Pushes to master run this through publish.yml instead, so publishing can wait on it.
  workflow_call:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.13.0"
      - run: uv sync --locked --all-extras
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.13.0"
      - run: uv export --frozen --all-extras --no-dev --no-emit-project --format requirements-txt > requirements.txt
      - run: uvx pip-audit==2.10.1 --strict --disable-pip -r requirements.txt

  test-linux:
    strategy:
      fail-fast: false
      matrix:
        python: ["3.14", "3.15"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.13.0"
          python-version: ${{ matrix.python }}
      - run: docker pull ghcr.io/letsencrypt/pebble:2.10.1
      - run: docker pull ghcr.io/letsencrypt/pebble-challtestsrv:2.10.1
      - run: uv sync --locked --all-extras
      - run: uv run pytest -n auto

  test-macos:
    strategy:
      fail-fast: false
      matrix:
        python: ["3.14", "3.15"]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.13.0"
          python-version: ${{ matrix.python }}
      - run: uv sync --locked --all-extras
      - run: uv run pytest -n auto -m "not acme and not system" --no-cov

  service:
    # Installs the real service: systemd on Linux and launchd on macOS, through the runners' passwordless sudo.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.13.0"
          python-version: "3.14"
      - run: uv sync --locked --all-extras
      - run: uv run pytest -m system --no-cov tests/system

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - run: docker build -t wildburrow:ci .
      - run: docker run --rm wildburrow:ci --version
      - run: test "$(docker run --rm --entrypoint id wildburrow:ci -u)" != "0"
