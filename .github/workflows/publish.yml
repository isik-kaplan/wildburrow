name: Publish

on:
  push:
    branches: [master]

# Keep this file's name: PyPI's trusted publisher is configured against "publish.yml".

permissions:
  contents: read

jobs:
  tests:
    uses: ./.github/workflows/ci.yml

  mutation:
    uses: ./.github/workflows/mutation.yml

  version:
    # Never publish a version that failed its tests or left a mutant alive.
    needs: [tests, mutation]
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      changed: ${{ steps.version.outputs.changed }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.13.0"
          enable-cache: false
      - id: version
        run: |
          local=$(uv version --short)
          published=$(curl -sf https://pypi.org/pypi/wildburrow/json | jq -r .info.version || true)
          echo "local $local, published ${published:-none}"
          echo "version=$local" >> "$GITHUB_OUTPUT"
          echo "changed=$([ "$local" != "$published" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  pypi:
    needs: version
    if: needs.version.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.13.0"
          # What gets published is built from nothing a cache could have planted.
          enable-cache: false
      - run: uv build
      - uses: pypa/gh-action-pypi-publish@v1.14.2

  image:
    needs: [version, pypi]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: docker/setup-qemu-action@v4.4.0
      - uses: docker/setup-buildx-action@v4.4.1
      - uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ needs.version.outputs.version }}
            ghcr.io/${{ github.repository }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.version.outputs.version }}
            org.opencontainers.image.licenses=MIT
