<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>$heading</title>
<style>
  :root {
    color-scheme: light dark;
    --ink: #1d1d1f; --muted: #6e6e73; --line: #d2d2d7; --paper: #ffffff; --wash: #f5f5f7;
    --accent: #0b57d0; --bad: #b3261e;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --ink: #f5f5f7; --muted: #a1a1a6; --line: #424245; --paper: #1c1c1e; --wash: #000000;
      --accent: #8ab4f8; --bad: #f2b8b5;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px;
    background: var(--wash); color: var(--ink); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  main {
    width: 100%; max-width: 360px; padding: 28px;
    background: var(--paper); border: 1px solid var(--line); border-radius: 12px;
  }
  h1 { margin: 0 0 4px; font-size: 20px; }
  p { margin: 0 0 20px; color: var(--muted); overflow-wrap: anywhere; }
  label { display: block; margin: 0 0 6px; font-size: 14px; font-weight: 600; }
  input {
    width: 100%; margin: 0 0 16px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px;
    background: var(--paper); color: var(--ink); font: inherit;
  }
  button {
    width: 100%; padding: 10px 12px; border: 0; border-radius: 8px; cursor: pointer;
    background: var(--accent); color: var(--paper); font: inherit; font-weight: 600;
  }
  .error { color: var(--bad); }
  .error:empty { display: none; }
</style>
</head>
<body>
<main>
  <h1>$heading</h1>
  <p>$message</p>
</main>
</body>
</html>
