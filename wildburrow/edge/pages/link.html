<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>$title</title>
<style>
  :root {
    color-scheme: light dark;
    --canvas: oklch(0.97 0 0); --card: oklch(1 0 0); --ink: oklch(0.145 0 0); --muted: oklch(0.556 0 0);
    --line: oklch(0.922 0 0); --field: transparent; --ring: oklch(0.708 0 0);
    --primary: oklch(0.205 0 0); --on-primary: oklch(0.985 0 0); --bad: oklch(0.577 0.245 27.325);
    --shadow: 0 1px 2px 0 oklch(0 0 0 / 0.05);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --canvas: oklch(0.145 0 0); --card: oklch(0.205 0 0); --ink: oklch(0.985 0 0); --muted: oklch(0.708 0 0);
      --line: oklch(1 0 0 / 0.1); --field: oklch(1 0 0 / 0.045); --ring: oklch(0.556 0 0);
      --primary: oklch(0.922 0 0); --on-primary: oklch(0.205 0 0); --bad: oklch(0.704 0.191 22.216);
      --shadow: none;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px;
    background: var(--canvas); color: var(--ink);
    font: 12px/1.6 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  main {
    width: 100%; max-width: 360px; display: grid; gap: 16px; padding: 16px;
    background: var(--card); border: 1px solid var(--line); box-shadow: var(--shadow);
  }
  header { display: grid; gap: 4px; }
  h1 { margin: 0; font-size: 14px; font-weight: 500; line-height: 1.4; }
  p { margin: 0; color: var(--muted); overflow-wrap: anywhere; }
  .host { color: var(--ink); font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  form { display: grid; gap: 12px; }
  .field { display: grid; gap: 6px; }
  label { font-weight: 500; line-height: 1; }
  input {
    width: 100%; height: 32px; padding: 4px 10px; border: 1px solid var(--line); border-radius: 0;
    background: var(--field); color: var(--ink); font: inherit; outline: none;
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  input:focus-visible, button:focus-visible {
    border-color: var(--ring); box-shadow: 0 0 0 1px color-mix(in oklch, var(--ring) 50%, transparent);
  }
  button {
    width: 100%; height: 32px; margin-top: 4px; padding: 0 10px; border: 1px solid transparent; border-radius: 0;
    background: var(--primary); color: var(--on-primary); font: inherit; font-weight: 500; cursor: pointer;
    outline: none; transition: opacity 0.15s;
  }
  button:hover { opacity: 0.8; }
  button:active { transform: translateY(1px); }
  .error {
    padding: 8px 10px; color: var(--bad);
    border: 1px solid color-mix(in oklch, var(--bad) 30%, transparent);
    background: color-mix(in oklch, var(--bad) 6%, transparent);
  }
  .error:empty { display: none; }
  /* Smaller text in a field makes phones zoom in on it. */
  @media (max-width: 640px) { input { font-size: 16px; } }
</style>
</head>
<body>
<main>
  <header>
    <h1>You've been invited</h1>
    <p>to <span class="host">$title</span>. This link works once, so it opens only when you continue.</p>
  </header>
  <form method="post" action="$action">
    <button type="submit" autofocus>Continue</button>
  </form>
</main>
</body>
</html>
