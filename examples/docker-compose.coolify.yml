# wildburrow as a Coolify "Docker Compose" application pointing at this file, behind Coolify's Traefik.
# Set DOMAIN, CLOUDFLARE_API_TOKEN, AUTHORIZED_KEYS and TOKEN_SIGNERS in Coolify, leave the service's domain empty,
# and turn off escaping special characters in labels so ${DOMAIN} reaches them. Clients connect over websocket on 443,
# with a key from AUTHORIZED_KEYS or a token signed by one from TOKEN_SIGNERS.
services:
  wildburrow:
    image: ghcr.io/isik-kaplan/wildburrow:0.3.0
    restart: unless-stopped
    volumes:
      - wildburrow-data:/data
    environment:
      WILDBURROW_DOMAIN: ${DOMAIN}
      WILDBURROW_TRANSPORTS: websocket
      WILDBURROW_AUTH: key,token
      WILDBURROW_AUTH_KEY_AUTHORIZED_KEYS: ${AUTHORIZED_KEYS}
      WILDBURROW_AUTH_TOKEN_SIGNERS: ${TOKEN_SIGNERS}
      WILDBURROW_DNS: cloudflare
      WILDBURROW_DNS_CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN}
      WILDBURROW_HTTPS_PROXY_PROTOCOL: "true"
    labels:
      - traefik.enable=true
      - traefik.tcp.routers.wildburrow.rule=HostSNIRegexp(`^(.+\.)?${DOMAIN}$$`)
      - traefik.tcp.routers.wildburrow.entrypoints=https
      - traefik.tcp.routers.wildburrow.tls.passthrough=true
      - traefik.tcp.routers.wildburrow.service=wildburrow
      - traefik.tcp.services.wildburrow.loadbalancer.server.port=443
      - traefik.tcp.services.wildburrow.loadbalancer.proxyprotocol.version=2
      - traefik.http.routers.wildburrow-http.rule=HostRegexp(`^(.+\.)?${DOMAIN}$$`)
      - traefik.http.routers.wildburrow-http.entrypoints=http
      - traefik.http.services.wildburrow-http.loadbalancer.server.port=80

volumes:
  wildburrow-data:
